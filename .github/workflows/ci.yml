
name: CI - Gestion des Stocks

on:
  push:
  pull_request:

jobs:
  tests-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestion_stocks
          POSTGRES_USER: stocks_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocks_user -d gestion_stocks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Autoriser Maven Wrapper
        run: chmod +x mvnw

      - name: Compiler et executer les tests
        env:
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: ./mvnw clean verify
